name: Sync Your Fork from OSS

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    # Company fork only: never run in OSS repo owned by ksharma20
    if: github.repository_owner != 'ksharma20'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Full history: the develop rebuild walks back up to SCAN_LIMIT commits.
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - name: Set upstream
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/ksharma20/venzio.git
          git fetch upstream

      - name: Sync main
        run: |
          git checkout main
          git reset --hard upstream/main
          git push origin main --force

      # `develop` is REBUILT on `main`, never merged into.
      #
      # `main` is a squash of `develop`, so at the moment of the squash `main`'s tree
      # equals the tree of the develop commit that was squashed. Walking develop's
      # first-parent line back to the newest commit with that tree recovers the cut
      # point with no bookkeeping. Everything after it is replayed onto the new `main`.
      - name: Rebuild develop on main
        id: rebuild
        env:
          SCAN_LIMIT: "200"
          DRY_RUN: "0"
        run: |
          set -euo pipefail

          git fetch origin --prune

          if ! git show-ref --verify --quiet refs/remotes/origin/develop; then
            echo "No origin/develop. Nothing to rebuild."
            echo "status=no-develop" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MAIN=$(git rev-parse origin/main)
          DEV=$(git rev-parse origin/develop)
          MAIN_TREE=$(git rev-parse "origin/main^{tree}")

          # Already rebuilt: if main is an ancestor of develop, develop is main plus
          # whatever has been pushed since. Nothing to do, whatever that carry set is.
          if git merge-base --is-ancestor "$MAIN" "$DEV"; then
            echo "origin/main is already an ancestor of origin/develop. Nothing to do."
            echo "status=up-to-date" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Cut point. --first-parent so the cut can only land on develop's mainline;
          # a side-branch commit that coincidentally matched would make CUT..develop
          # carry mainline commits it should not.
          CUT=""
          for c in $(git rev-list --first-parent -n "$SCAN_LIMIT" origin/develop); do
            if [ "$(git rev-parse "$c^{tree}")" = "$MAIN_TREE" ]; then CUT="$c"; break; fi
          done

          if [ -z "$CUT" ]; then
            echo "::error::No commit on origin/develop within $SCAN_LIMIT has origin/main's tree."
            echo "Refusing to rebuild: the cut point cannot be identified."
            echo "status=no-cut-point" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "cut point : $CUT $(git log -1 --format=%s "$CUT")"
          echo "carry set :"
          git log --oneline --no-merges "$CUT..origin/develop" || true

          # Backup BEFORE anything is rewritten. Pushed, not local: the runner is
          # destroyed after the job, so a local ref would be an undo button that no
          # longer exists. Undo is:
          #   git push origin backup/develop/<ts>:develop --force
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          BACKUP="backup/develop/$TS"
          if [ "$DRY_RUN" != "1" ]; then
            git push origin "$DEV:refs/heads/$BACKUP"
          fi
          echo "backup=$BACKUP" >> "$GITHUB_OUTPUT"

          # Replay. `rebase --onto`, not `cherry-pick`: the carry set contains merge
          # commits and cherry-pick refuses a merge without -m. Plain rebase drops the
          # merges and replays the real commits, which is the linear develop we want.
          git checkout -B develop "$DEV"
          if git rebase --onto "$MAIN" "$CUT" develop; then
            if [ "$DRY_RUN" != "1" ]; then
              git push origin develop --force-with-lease="develop:$DEV"
            fi
            echo "status=rebuilt" >> "$GITHUB_OUTPUT"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Conflict: the OSS squash landed with edits on top of what develop sent.
          # origin/develop is left EXACTLY as it was; the partial replay is pushed for
          # a human to finish.
          PARTIAL=$(git rev-parse HEAD)
          STUCK=$(git rev-parse REBASE_HEAD 2>/dev/null || echo "")
          STUCK_SUBJECT=""
          if [ -n "$STUCK" ]; then STUCK_SUBJECT=$(git log -1 --format=%s "$STUCK"); fi
          git rebase --abort || git rebase --quit || true

          if [ "$DRY_RUN" != "1" ]; then
            git push origin "$PARTIAL:refs/heads/sync/develop-rebuild" --force
          fi

          {
            echo "conflict=true"
            echo "status=conflict"
            echo "cut=$CUT"
            echo "stuck=$STUCK"
            echo "stuck_subject=$STUCK_SUBJECT"
          } >> "$GITHUB_OUTPUT"

          echo "::warning::Rebuild of develop conflicted on ${STUCK:-unknown} (${STUCK_SUBJECT:-})."

      # A PR is the notification surface, NOT the fix. It must never be merged:
      # upstream_company_develop_to_oss.yaml upstreams any merged PR into develop
      # unless it is labeled `sync`, so the label is load-bearing against an echo loop.
      - name: Open DO NOT MERGE PR for the conflicted rebuild
        if: steps.rebuild.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CUT: ${{ steps.rebuild.outputs.cut }}
          STUCK: ${{ steps.rebuild.outputs.stuck }}
          STUCK_SUBJECT: ${{ steps.rebuild.outputs.stuck_subject }}
          BACKUP: ${{ steps.rebuild.outputs.backup }}
        run: |
          set -euo pipefail

          EXISTING="$(gh pr list --repo "$REPO" --head sync/develop-rebuild --base develop --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            echo "Existing rebuild PR found: #$EXISTING"
            exit 0
          fi

          BODY=$(cat <<EOF
          **DO NOT MERGE.** This PR is a notification, not a fix. Merging it would create a
          merge commit on \`develop\` and re-create the divergence the rebuild exists to remove.

          The nightly rebuild of \`develop\` onto \`main\` stopped on a conflict.
          \`origin/develop\` has **not** been touched.

          | | |
          |---|---|
          | Cut point | \`$CUT\` |
          | Conflicting commit | \`$STUCK\` — $STUCK_SUBJECT |
          | Pre-rebuild develop | \`$BACKUP\` |
          | Partial replay | \`sync/develop-rebuild\` |

          Finish it locally:

          \`\`\`bash
          git fetch origin
          git checkout -B develop origin/develop
          git rebase --onto origin/main $CUT develop
          # resolve, then:
          git rebase --continue
          git push origin develop --force-with-lease
          \`\`\`

          Then close this PR and delete \`sync/develop-rebuild\`.
          EOF
          )

          gh pr create \
            --repo "$REPO" \
            --base develop \
            --head sync/develop-rebuild \
            --label sync \
            --title "DO NOT MERGE — develop rebuild conflicted on $STUCK" \
            --body "$BODY"

      # Backup branches are an undo button with a shelf life, not an archive.
      - name: Prune backup branches older than 30 days
        if: always() && steps.rebuild.outputs.status != 'no-develop'
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -d '30 days ago' +%Y%m%dT%H%M%SZ)
          git fetch origin --prune
          # strip=3 yields the full branch name (backup/develop/<ts>); the timestamp
          # is its last path component, and the ISO basic format sorts lexically.
          for branch in $(git for-each-ref --format='%(refname:strip=3)' 'refs/remotes/origin/backup/develop/*'); do
            TS_PART="${branch##*/}"
            if [[ "$TS_PART" < "$CUTOFF" ]]; then
              echo "Deleting stale backup branch $branch"
              git push origin --delete "$branch" || true
            fi
          done
